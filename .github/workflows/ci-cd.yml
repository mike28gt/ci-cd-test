# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI/CD - Java + Docker + Trivy + Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:latest
  IMAGE_SHA: ghcr.io/${{ github.repository }}:${{ github.sha }}
  APP_PORT: 8080

jobs:
  build-test-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'
          cache: 'maven'

      - name: Build & Test (Maven)
        run: mvn -B -DskipTests=false clean package

      - name: Docker login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build -t "${IMAGE_NAME}" -t "${IMAGE_SHA}" .
          docker image ls

      - name: Trivy scan (Docker image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'table'
          exit-code: '0'         # poner '1' para bloquear en HIGH/CRITICAL
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Push image to GHCR
        run: |
          docker push "${IMAGE_NAME}"
          docker push "${IMAGE_SHA}"

  deploy:
    needs: build-test-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy via SSH (pull & run)
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no"
          HOST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          # login GHCR en el servidor
          ssh $SSH_OPTS $HOST "echo '${{ github.token }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin"

          # parar contenedor previo y arrancar nuevo
          ssh $SSH_OPTS $HOST "docker rm -f devsecops-demo-java || true"
          ssh $SSH_OPTS $HOST "\
            docker pull '${{ env.IMAGE_NAME }}' && \
            docker run -d --name devsecops-demo-java \
              --restart=always \
              -p ${{ env.APP_PORT }}:8080 \
              '${{ env.IMAGE_NAME }}' \
          "

          # health check
          sleep 3
          ssh $SSH_OPTS $HOST "curl -fsS http://localhost:${{ env.APP_PORT }}/health || (docker logs devsecops-demo-java && false)"
